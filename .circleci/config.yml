jobs:
  pool_spec:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Build artifact C
          command: |
            mkdir -p /tmp/stage-delta
            set +o pipefail 2>/dev/null; seq 1 1428540 | sha384sum > /tmp/stage-delta/SurgeVault; true
            echo "wrote (η)"
      - persist_to_workspace:
          root: /tmp/stage-delta
          paths:
            - 'SurgeVault'
  STAGE_DEV:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/stage-delta
      - run:
          name: Close stream A
          command: |
            od -An -td1 /tmp/stage-delta/SurgeVault 2>/dev/null | head -1 | awk '{sum=0; for(i=1;i<=NF;i++)sum+=$i; print sum}' || true
      - run:
          name: Load repo
          command: git clone --depth 2 --no-single-branch --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Restore snapshot
          command: tar -xzvf stage-bundle-release.tgz
      - run:
          name: Store metadata
          command: mkdir -p artifacts
      - run:
          name: Cooldown
          command: env | wc -l
